id: repository-standards
task: |
  Check that repository guidance and tracked alignment standards remain available.
checks:
  - id: agents-file
    type: command
    command: test -f AGENTS.md
    required: true
    weight: 0.25
  - id: active-rust-quality-standard
    type: command
    command: test -f .svdo/standards/1-rust-quality/SKILL.md
    required: true
    weight: 0.25
  - id: active-rust-architecture-standard
    type: command
    command: test -f .svdo/standards/2-rust-architecture/SKILL.md
    required: true
    weight: 0.25
  - id: alignment-standard
    type: judge
    standard: 2-rust-architecture/SKILL.md
    weight: 0.25
threshold: 0.5
